name: Jammer CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify pinned EasyList source and compiler baseline
        run: npm run rules:prepare:easylist
      - name: Verify pinned EasyList cosmetic sources
        run: npm run rules:prepare:cosmetic
      - name: Build isolated EasyList smoke profile
        run: npm run build:easylist-smoke
      - name: Build full Jammer EasyList product profile
        run: node scripts/build-product.mjs
      - name: Package release candidate
        run: npm run release:package
      - name: Audit release candidate
        run: npm run release:audit
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: jammer-release-candidate
          path: |
            release/jammer-0.7.1-chromium.zip
            release/jammer-0.7.1-chromium.zip.sha256
            release/jammer-0.7.1.release.json
          if-no-files-found: error
      - name: Generate GitHub social preview
        run: npm run brand:preview
      - name: Upload branding preview
        uses: actions/upload-artifact@v4
        with:
          name: jammer-brand-preview
          path: |
            generated/brand/social-preview.png
            generated/brand/icon-128.png
          if-no-files-found: error
