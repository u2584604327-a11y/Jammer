name: Jammer CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify pinned EasyList source and compiler baseline
        run: npm run rules:prepare:easylist
      - name: Build isolated EasyList smoke profile
        run: npm run build:easylist-smoke
      - name: Build full Jammer EasyList product profile
        run: node scripts/build-product.mjs
