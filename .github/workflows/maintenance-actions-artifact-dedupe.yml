name: Jammer targeted old duplicate Actions artifact audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'maintenance/actions_artifact_dedupe.py'
      - '.github/workflows/maintenance-actions-artifact-dedupe.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: jammer-old-artifact-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  audit-old-duplicate-jammer-artifacts:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'maintenance/actions-artifact-duplicates-cleanup-20261030' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLEANUP_MODE: dry-run
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Reject unexpected repo and record conservative duplicate inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "u2584604327-a11y/Jammer"
          test "$CLEANUP_MODE" = dry-run
          python -m py_compile maintenance/actions_artifact_dedupe.py
          python maintenance/actions_artifact_dedupe.py | tee /tmp/jammer-artifact-audit.txt
          grep -Fxq 'JAMMER_DELETE_MODE=dry-run' /tmp/jammer-artifact-audit.txt
          grep -Fxq 'JAMMER_DELETED_COUNT=0' /tmp/jammer-artifact-audit.txt
          {
            echo "## Jammer post-cleanup read-only inventory"
            echo "Only old duplicate candidate and preview artifacts; newest five per type preserved, at most 150 IDs and 160 MiB; no releases."
            echo "~~~"
            cat /tmp/jammer-artifact-audit.txt
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Always discard inventory text
        if: always()
        run: rm -f /tmp/jammer-artifact-audit.txt
