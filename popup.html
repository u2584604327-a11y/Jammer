<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jammer</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main>
  <div class="row">
    <h1>Jammer</h1>
    <select id="language-select" class="compact-select" aria-label="Language">
      <option value="auto">Auto</option>
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
  </div>
  <p id="build-id" class="muted">Build: p1-runtime-fix2</p>
  <section class="card">
    <div class="row"><label id="protection-label" for="protection">Protection</label><input id="protection" type="checkbox"></div>
    <p id="status" class="muted">Loading…</p>
  </section>
  <section class="card">
    <div class="row"><label id="cosmetic-label" for="cosmetic-enabled">Page ad cleanup</label><input id="cosmetic-enabled" type="checkbox"></div>
    <p id="cosmetic-hint" class="muted">Hide explicit ad containers. Enabling requires website access.</p>
    <p id="cosmetic-status" class="muted"></p>
  </section>
  <button id="open-options" type="button">Options</button>
</main>
<script src="popup.js"></script>
</body>
</html>
