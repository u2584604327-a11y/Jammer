<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jammer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
<main class="app-shell">
  <header class="brand-header">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true"><span>J</span></span>
      <div>
        <h1>Jammer</h1>
        <p id="build-id" class="build-id">Build: p51-ui-polish-dev</p>
      </div>
    </div>
    <select id="language-select" class="compact-select" aria-label="Language">
      <option value="auto">Auto</option>
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <section class="card feature-card feature-card-primary">
    <div class="feature-copy">
      <label id="protection-label" for="protection">Protection</label>
      <p id="status" class="status-line">Loading…</p>
    </div>
    <input id="protection" class="switch" type="checkbox">
  </section>

  <section class="card feature-card">
    <div class="feature-copy">
      <label id="cosmetic-label" for="cosmetic-enabled">Page ad cleanup</label>
      <p id="cosmetic-hint" class="muted">Hide explicit ad containers. Enabling requires website access.</p>
      <p id="cosmetic-status" class="status-line"></p>
    </div>
    <input id="cosmetic-enabled" class="switch" type="checkbox">
  </section>

  <button id="open-options" class="primary-button" type="button">Options</button>
</main>
<script src="popup.js"></script>
</body>
</html>
